# =============================================================================
#  MAVERIC Public Beacon Definition for gr-satellites
# =============================================================================
#
#  Trimmed, single-mode SatYAML for the public SatNOGS-style decoder
#  (MAV_BEACON.grc / MAV_BEACON.py). Covers only the nominal deployed
#  downlink so a hobbyist observer can decode the MAVERIC beacon and hand
#  back the resulting frames.
#
#  Nominal mode:  9k6 FSK, AX100 Mode 5 (ASM+Golay), 437.575 MHz UHF.
#
#  For the full multi-baud / multi-framing matrix used by the ground
#  station itself, see MAVERIC_DECODER.yml instead.

name: MAVERIC
norad: 0              # No NORAD catalog number assigned (pre-launch)

# Pass-through telemetry: frames are forwarded raw (no structured parser).
data:
  &tlm Telemetry:
    unknown: {}

transmitters:
  9k6 FSK AX100 ASM+Golay downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 9600
    framing: AX100 ASM+Golay
    data:
      - *tlm
