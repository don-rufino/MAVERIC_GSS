# =============================================================================
#  MAVERIC Satellite Definition for gr-satellites
# =============================================================================
#
#  Used by:  gr_satellites -f maveric_decoder.yml
#
#  Defines available transmitter modes so gr-satellites knows how to
#  decode received signals. Each transmitter entry specifies the
#  modulation, baud rate, and framing format.
#
#  All frequencies are in Hz (scientific notation, e.g. 437.575e+6).
#
#  AX100 modes covered:
#    Mode 5 — ASM+Golay: NRZ, CCSDS randomized, MSB first (recommended)
#    Mode 6 — AX.25 HDLC: NRZI, G3RUH scrambled, LSB first
#
#  AX100 baud rates: 0.1–38.4 kbps (GFSK modulation)
#  gr-satellites runs all entries in parallel; only the matching
#  framing/baud produces valid decoded frames.
#
#  Deviation provenance (2026-07-11, corrected same day after audit):
#  MAVERIC's flight AX100 param dump shows modindex 0.0 = AUTOMATIC —
#  the manual's auto table picks h = 1/1.5 for 1300–60000 baud, so 9k6
#  predicts dev 3200 (primary hypothesis; the same h was hardware-
#  verified against the flight unit in the Mode 5 uplink bench tests).
#  Secondary h=0.5 branches (9k6 dev 2400, 4k8 dev 1200) ride alongside
#  because some AX100 birds do fly h=0.5 (measured on ROADS 2's radio;
#  Suomi 100 official). 4k8 dev 1600 is the auto default and the
#  official value for the fallback birds Luojia-1 / AISTECHSAT-2.
#  (The dump's 437.250 MHz was a pre-flight setting — since changed to
#  437.575; mode 5, csp_rs/crc/rand all true, preamble 50 x 0xAA.)

name: MAVERIC
norad: 0              # No NORAD catalog number assigned (pre-launch)

# Telemetry data definition — YAML anchor (&tlm) referenced by all transmitters.
# Currently a pass-through: no telemetry parser defined, raw frames are forwarded.
data:
  &tlm Telemetry:
    unknown: {}       # No structured telemetry decoder — frames passed through raw

# Available transmitter modes on the MAVERIC AX100 radio (437.575 MHz UHF)
# Covers 4k8–38k4 baud for both Mode 5 (ASM+Golay) and Mode 6 (AX.25)
transmitters:

  # -- Mode 5: ASM+Golay (recommended) ----------------------------------------
  # 2k4 exists for the CATSAT mission package (437.185 MHz beacons,
  # deviation 750 Hz per the gr-satellites SatYAML); MAVERIC itself
  # does not beacon at 2k4.
  2k4 FSK AX100 ASM+Golay downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 2400
    deviation: 750
    framing: AX100 ASM+Golay
    data:
      - *tlm
  4k8 FSK AX100 ASM+Golay downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 4800
    deviation: 1600            # AX100 auto-modindex default (h = 2/3);
    framing: AX100 ASM+Golay   # official for Luojia-1 / AISTECHSAT-2
    data:
      - *tlm
  4k8 FSK AX100 ASM+Golay downlink (h=0.5):
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 4800
    deviation: 1200            # h=0.5 hypothesis (measured on ROADS 2's radio)
    framing: AX100 ASM+Golay
    data:
      - *tlm
  9k6 FSK AX100 ASM+Golay downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 9600
    deviation: 3200            # AX100 auto-modindex default (h = 2/3) — primary
    framing: AX100 ASM+Golay
    data:
      - *tlm
  9k6 FSK AX100 ASM+Golay downlink (h=0.5):
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 9600
    deviation: 2400            # secondary: some AX100s fly h=0.5 (ROADS 2
    framing: AX100 ASM+Golay   # measured); ~0.5 dB tighter Carson if MAVERIC does
    data:
      - *tlm
  19k2 FSK AX100 ASM+Golay downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 19200
    deviation: 6400
    framing: AX100 ASM+Golay
    data:
      - *tlm
  38k4 FSK AX100 ASM+Golay downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 38400
    deviation: 12800
    framing: AX100 ASM+Golay
    data:
      - *tlm

  # -- Mode 6: AX.25 HDLC -----------------------------------------------------
  4k8 FSK AX.25 G3RUH downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 4800
    deviation: 1600
    framing: AX.25 G3RUH
    data:
      - *tlm
  9k6 FSK AX.25 G3RUH downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 9600
    deviation: 3200
    framing: AX.25 G3RUH
    data:
      - *tlm
  19k2 FSK AX.25 G3RUH downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 19200
    deviation: 6400
    framing: AX.25 G3RUH
    data:
      - *tlm
  38k4 FSK AX.25 G3RUH downlink:
    frequency: 437.575e+6      # Hz
    modulation: FSK
    baudrate: 38400
    deviation: 12800
    framing: AX.25 G3RUH
    data:
      - *tlm
