# =============================================================================
#  ROADS (UND pair) Satellite Definition for gr-satellites
# =============================================================================
#
#  Selected by MAV_DUO automatically when GSS_MISSION=roads (per-mission
#  <MISSION>_DECODER.yml convention; GSS_DECODER_YML overrides explicitly).
#  Both birds share 435.400 MHz; ROADS 1 = NORAD 64535, ROADS 2 = 64549.
#
#  Deviations here are measured/derived, NOT the SatYAML 1/3-baud convention:
#    4k8 dev 1200 (h = 0.5) — MEASURED from the first decoded ROADS 2 frame
#      (2026-07-11) by data-aided fit against the golden frame's wire bits;
#      the dev-1200 Carson filter holds +0.5-1 dB more decode margin than
#      the old dev-1600 assumption on the recorded burst.
#    9k6 dev 2400 (h = 0.5) — predicted from the AX100 modindex-0 radio
#      default that the 4k8 measurement confirmed; SatNOGS lists 9k6 as the
#      active UHF mode for 64535.

name: ROADS
norad: 64535
data:
  &tlm Telemetry:
    unknown: {}

transmitters:
  4k8 FSK AX100 ASM+Golay downlink:
    frequency: 435.400e+6
    modulation: FSK
    baudrate: 4800
    deviation: 1200
    framing: AX100 ASM+Golay
    data:
      - *tlm
  9k6 FSK AX100 ASM+Golay downlink:
    frequency: 435.400e+6
    modulation: FSK
    baudrate: 9600
    deviation: 2400
    framing: AX100 ASM+Golay
    data:
      - *tlm
