# CATSAT mission database (RX-only).
#
# Beacon format follows the community Kaitai definition
# (satnogs-decoders catsat.ksy): 18 beacon types across the GomSpace
# stack (NanoMind OBC, BPX battery, P60/PDU/ACU power, AX100 radio HK,
# ADCS, and the ASDR payload), selected by the type byte in the 5-byte
# sub-header after the little-endian CSP header. parameters and
# sequence_containers below are generated from the ksy by the mission
# codec's field table — token order must match telemetry.BEACONS.
schema_version: 1
id: catsat
name: "CATSAT"
header:
  version: "1.1.0"
  date: "2026-07-10"
  description: "CATSAT RX-only declarative mission database (full ksy port)"

parameter_types:
  utc_token:
    kind: string
    encoding: ascii_token
    description: "ISO-8601 UTC timestamp from a GomSpace HK table header"
  str_token:
    kind: string
    encoding: ascii_token
    description: "Short ASCII text field"
  hex_token:
    kind: string
    encoding: ascii_token
    description: "0x-prefixed hex value (lossless raw bytes)"
  int_i:
    kind: int
    size_bits: 32
    signed: true
    description: "Raw integer telemetry value"
  count_l:
    kind: int
    size_bits: 64
    signed: true
    description: "Wide counter / u32-range value"
  float_f:
    kind: float
    description: "Raw float telemetry value"

