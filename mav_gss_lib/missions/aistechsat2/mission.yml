# AISTECHSAT-2 mission database (RX-only).
#
# Generated from the field table in telemetry.py (a port of the
# gr-satellites `satellites.telemetry.lume` construct stack shared by
# LUME-1 and AISTECHSAT-2). Five PUS housekeeping payloads — OBC / EPS /
# TTC+GSSB / AOCS / TEMPS — selected by the u16 payload id; token order
# and container entry lists derive from the same table, guarded by
# test_aistechsat2_yml_containers_match_field_table.
schema_version: 1
id: aistechsat2
name: "AISTECHSAT-2"
header:
  version: "1.0.0"
  date: "2026-07-11"
  description: "AISTECHSAT-2 RX-only declarative mission database"

parameter_types:
  utc_token:
    kind: string
    encoding: ascii_token
    description: "ISO-8601 UTC timestamp from an onboard unix clock"
  hex_token:
    kind: string
    encoding: ascii_token
    description: "0x-prefixed hex register/array value"
  str_token:
    kind: string
    encoding: ascii_token
    description: "Whitespace-sanitized ascii string"
  float_f:
    kind: float
    description: "Raw float telemetry value"
  degc_f:
    kind: float
    unit: "degC"
    description: "Temperature, float"
  mv_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "mV"
    description: "Voltage, raw millivolts"
  ma_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "mA"
    description: "Current, raw milliamps"
  degc_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "degC"
    description: "Temperature, integer sensor"
  dbm_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "dBm"
    description: "Radio signal strength"
  hz_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "Hz"
    description: "Frequency error"
  pct_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "%"
    description: "Duty-cycle percentage"
  sec_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "s"
    description: "Elapsed / configured seconds"
  sec_l:
    kind: int
    size_bits: 64
    signed: true
    unit: "s"
    description: "Elapsed / remaining seconds (u32 range)"
  day_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "d"
    description: "PUS time field, days"
  ms_i:
    kind: int
    size_bits: 32
    signed: true
    unit: "ms"
    description: "PUS time field, milliseconds of day"
  count_i:
    kind: int
    size_bits: 32
    signed: true
    description: "Dimensionless counter"
  count_l:
    kind: int
    size_bits: 64
    signed: true
    description: "Dimensionless wide counter (u32/u64 range)"
  bytes_l:
    kind: int
    size_bits: 64
    signed: true
    unit: "B"
    description: "Byte count"
  mode_i:
    kind: int
    size_bits: 32
    signed: true
    description: "Mode / status register, raw integer"

