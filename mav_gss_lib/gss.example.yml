# Ground Station Operator Config (Example)
#
# Native v2 split shape. `platform.*` holds station-wide transport and general
# config; `mission.*` selects the active mission and overrides mission-declared
# editable config keys (per the mission's `MissionConfigSpec.editable_paths`).
# Mission identity constants (nodes, ptypes, mission name, ui titles, command
# schema filename) are NOT operator-editable — they live in the mission
# package's own code (e.g. `missions/maveric/defaults.py`) and are protected
# via `MissionConfigSpec.protected_paths`.
#
# Copy this file to gss.yml and adjust for your station.

platform:
  tx:
    zmq_addr: tcp://127.0.0.1:52002
    delay_ms: 500
    # Experimental satellite-hunting only; keep true for normal operations.
    # Set false to cancel response-window verification and permit repeated
    # commands. TX delay and the active-send queue lock still apply.
    verifiers_enabled: true
    # Uplink/base TX frequency. Doppler live tuning uses
    # platform.tracking.frequencies.tx_hz.
    frequency: 437.575 MHz
  rx:
    zmq_addr: tcp://127.0.0.1:52001
    # Downlink/base RX frequency. Doppler live tuning uses
    # platform.tracking.frequencies.rx_hz.
    frequency: 437.575 MHz
    tx_blackout_ms: 0
  radio:
    enabled: true
    autostart: false
    # Relative to the repository root. The backend launches this with the
    # same Python interpreter running MAV_WEB.py and sets cwd to gnuradio/.
    script: gnuradio/MAV_DUO.py
    log_lines: 1000
  general:
    log_dir: logs
    generated_commands_dir: generated_commands

  # Station identity catalog — hostname → station ID.
  # Every laptop runs the same gss.yml; each resolves its own station by
  # hostname at startup. Unknown hosts fall back to the raw hostname label.
  # UI config saves CANNOT change this catalog — edit the file directly.
  stations:
    gs-laptop-0.local: GS-0
    gs-laptop-1.local: GS-1
    gs-laptop-2.local: GS-2

  # TLE fetch (OFF by default). The GSS can fetch MAVERIC's TLE from CelesTrak
  # into platform.tracking.tle once the spacecraft is cataloged. Leave disabled
  # pre-launch; manual paste remains the primary path until then.
  # tracking:
  #   tle_fetch:
  #     identifier: ""            # MAVERIC NORAD ID / intl-designator / name once cataloged; "" disables fetch
  #     auto_refresh: false       # set true post-launch to refresh on the interval below
  #     refresh_interval_hours: 12
  #   # Space-Track fallback credentials are read from the environment only,
  #   # never from this file: SPACETRACK_IDENTITY / SPACETRACK_PASSWORD
  #   control:
  #     # Adds a computed Received Power (EIRP - path loss + Rx gain) to
  #     # tracking_sample log rows once both this station's and MAVERIC's
  #     # link-budget figures (below) are confirmed. Off by default — Signal
  #     # Loss (path loss alone) always logs regardless of this setting.
  #     link_budget_enabled: false
  #   stations:
  #     - id: usc
  #       name: "USC GS"
  #       lat_deg: 34.0205
  #       lon_deg: -118.2856
  #       alt_m: 70
  #       min_elevation_deg: 5
  #       tx_eirp_dbw: 10.3094      # this station's uplink transmit EIRP
  #       rx_gain_dbi: 40.2         # this station's receive antenna gain
  #   # The tracked satellite's own link-budget figures (mission-scoped,
  #   # unlike the station hardware above — a different bird has different
  #   # EIRP/gain). Lives in each mission's own gss.<mission>.yml.
  #   link_budget:
  #     satellite_eirp_dbw: -3.0059      # this satellite's downlink transmit EIRP
  #     satellite_rx_gain_dbi: 0.0       # this satellite's receive antenna gain

mission:
  id: maveric
  # mission.config overrides mission-declared editable paths. For MAVERIC:
  # csp.* and imaging.thumb_prefix.
  config: {}
